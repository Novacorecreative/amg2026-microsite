<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d4f4a">
  <title>AMG 2026 · Goa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d4f4a'/%3E%3Ccircle cx='44' cy='22' r='9' fill='%23f2b84b'/%3E%3Cpath d='M6 44c8-6 14-6 22 0s14 6 22 0 10-4 10-4v16H6z' fill='%23e8704a'/%3E%3C/svg%3E">
</head>
<body>
  <header class="hero">
    <div class="sun"></div>
    <picture class="banner-art" id="bannerArt"><source media="(max-width: 700px)"><img alt=""></picture>
    <div class="hero-inner">
      <div class="top">
        <div class="brand">
          <span class="brand-logo hidden" id="brandLogo"><img alt=""></span>
          <div class="client" id="clientName">Grindwell Norton presents</div>
        </div>
        <button class="avatar-btn hidden" id="meBtn" title="My profile"></button>
      </div>
      <h1 id="eventTitle">AMG <span>2026</span></h1>
      <div class="tagline hidden" id="tagline"></div>
      <div class="meta" id="eventMeta">Goa</div>
      <div class="countdown hidden" id="countdown"></div>
    </div>
    <svg class="wave wave2" viewBox="0 0 1440 60" preserveAspectRatio="none"><path fill="currentColor" d="M0 30c120 18 240 18 360 0s240-18 360 0 240 18 360 0 240-18 360 0v30H0z"/></svg>
    <svg class="wave" viewBox="0 0 1440 60" preserveAspectRatio="none"><path fill="currentColor" d="M0 40c160-22 320-22 480 0s320 22 480 0 320-22 480 0v20H0z"/></svg>
  </header>

  <nav class="tabs hidden" id="tabs">
    <a href="#feed" data-tab="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#agenda" data-tab="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Agenda</a>
    <a href="#engage" data-tab="engage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Play<span class="dot hidden" id="engageDot"></span></a>
    <a href="#gallery" data-tab="gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Gallery</a>
    <a href="#chat" data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat<span class="dot hidden" id="chatDot"></span></a>
  </nav>

  <main id="view"></main>
  <footer class="partners hidden" id="partners"></footer>
  <div id="toasts"></div>

  <script src="/js/brand.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
